name: Emulators (two phones)

# Two clean Android emulators play together through the minified app.
# Default: backend + live Ollama run on the CI machine (http://10.0.2.2:8000).
on:
  workflow_dispatch:
  push:
    paths: ["android/**", "server/**", "tools/emulator_e2e.py", ".github/workflows/emulator.yml"]

jobs:
  two-phones:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Backend with live Ollama
        run: |
          docker run -d --name ollama -p 11434:11434 -e OLLAMA_NUM_PARALLEL=1 ollama/ollama:0.40.17
          for i in $(seq 1 30); do curl -fs localhost:11434/api/tags >/dev/null && break; sleep 2; done
          docker exec ollama ollama pull qwen2.5:0.5b
          pip install -q -r server/requirements.txt
          mkdir -p /tmp/data
          (cd server && DATA_DIR=/tmp/data OLLAMA_URL=http://127.0.0.1:11434 LLM_NUM_THREAD=2 \
             nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &)
          for i in $(seq 1 30); do curl -fs localhost:8000/v1/health && break; sleep 1; done

      - name: Build minified e2e APK
        env: { FONAR_BACKEND_URL: "http://10.0.2.2:8000" }
        run: cd android && ./gradlew --no-daemon :app:assembleE2e

      - name: Start two emulators
        run: |
          set -x
          SDK="$ANDROID_HOME"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $SDK/cmdline-tools/*/bin/sdkmanager | tail -1)"
          AVDM="$(dirname "$SDKM")/avdmanager"
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64" > /tmp/sdk.log 2>&1 || { tail -n 20 /tmp/sdk.log; exit 1; }
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"
          export PATH="$SDK/platform-tools:$SDK/emulator:$PATH"
          ls -la /dev/kvm
          for n in A B; do
            echo no | "$AVDM" create avd -n phone$n -k "system-images;android-34;google_apis;x86_64" -d pixel_5 --force
          done
          emulator -list-avds
          ls -la "$ANDROID_AVD_HOME"
          adb start-server
          nohup emulator -avd phoneA -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 -cores 2 -camera-back none -camera-front none > /tmp/emu-A.log 2>&1 &
          PID_A=$!
          sleep 20
          nohup emulator -avd phoneB -port 5556 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 -cores 2 -camera-back none -camera-front none > /tmp/emu-B.log 2>&1 &
          PID_B=$!
          for d in emulator-5554 emulator-5556; do
            ok=0
            for i in $(seq 1 120); do
              if [ "$(adb -s $d shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then ok=1; break; fi
              if ! kill -0 $PID_A 2>/dev/null || ! kill -0 $PID_B 2>/dev/null; then echo "::error::emulator process exited"; break; fi
              sleep 5
            done
            if [ $ok != 1 ]; then echo "::error::$d did not boot"; tail -n 30 /tmp/emu-A.log /tmp/emu-B.log; adb devices; exit 1; fi
            adb -s $d shell input keyevent 82 || true
          done
          adb devices

      - name: Two-phone scenario
        timeout-minutes: 45
        run: |
          python3 tools/emulator_e2e.py --apk android/app/build/outputs/apk/e2e/app-e2e.apk \
            --pkg app.fonar.e2e --a emulator-5554 --b emulator-5556 --out screens

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: emulator-screens, path: screens, if-no-files-found: ignore }

      - name: Diagnostics
        if: failure()
        run: |
          tail -n 25 /tmp/emu-A.log /tmp/emu-B.log 2>/dev/null || true
          tail -n 30 /tmp/api.log
