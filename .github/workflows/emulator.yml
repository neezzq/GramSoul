name: Emulators (two phones)

# Two clean Android emulators play together through the minified app.
# Default: backend + live Ollama run on the CI machine (http://10.0.2.2:8000).
on:
  workflow_dispatch:
  push:
    paths: ["android/**", "server/**", "tools/emulator_e2e.py", ".github/workflows/emulator.yml"]

jobs:
  two-phones:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Backend with live Ollama
        run: |
          docker run -d --name ollama -p 11434:11434 -e OLLAMA_NUM_PARALLEL=1 ollama/ollama:0.40.17
          for i in $(seq 1 30); do curl -fs localhost:11434/api/tags >/dev/null && break; sleep 2; done
          docker exec ollama ollama pull qwen2.5:0.5b
          pip install -q -r server/requirements.txt
          mkdir -p /tmp/data
          (cd server && DATA_DIR=/tmp/data OLLAMA_URL=http://127.0.0.1:11434 LLM_NUM_THREAD=2 \
             nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &)
          for i in $(seq 1 30); do curl -fs localhost:8000/v1/health && break; sleep 1; done

      - name: Build minified e2e APK
        env: { FONAR_BACKEND_URL: "http://10.0.2.2:8000" }
        run: cd android && ./gradlew --no-daemon :app:assembleE2e

      - name: Start two emulators
        run: |
          SDK="$ANDROID_HOME"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64" >/dev/null
          for n in A B; do
            echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n phone$n -k "system-images;android-34;google_apis;x86_64" -d pixel_5 --force
          done
          for p in 5554 5556; do
            n=$([ $p = 5554 ] && echo A || echo B)
            nohup "$SDK/emulator/emulator" -avd phone$n -port $p -no-window -no-audio -no-boot-anim -no-snapshot \
              -gpu swiftshader_indirect -memory 2048 -cores 2 -camera-back none -camera-front none > /tmp/emu-$n.log 2>&1 &
          done
          for d in emulator-5554 emulator-5556; do
            timeout 600 adb -s $d wait-for-device
            until [ "$(adb -s $d shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 5; done
            adb -s $d shell input keyevent 82 || true
          done
          adb devices

      - name: Two-phone scenario
        run: |
          python3 tools/emulator_e2e.py --apk android/app/build/outputs/apk/e2e/app-e2e.apk \
            --pkg app.fonar.e2e --a emulator-5554 --b emulator-5556 --out screens

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: emulator-screens, path: screens, if-no-files-found: ignore }

      - name: API log
        if: always()
        run: tail -n 150 /tmp/api.log
