name: Web app

# The browser version at https://<domain>/app/ (iPhone: «На экран „Домой“»), checked in an
# iPhone-sized Chromium against the API with the fake model.
on:
  push:
    paths: ["deploy/site/**", "server/**", "tools/web_dev.py", "tools/web_e2e.js", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: API + web app on one origin
        run: |
          pip install -q -r server/requirements.txt
          mkdir -p /tmp/webdata
          # a throwaway admin password for this run only, so the admin page is tested too
          ADMIN_PASSWORD="ci-$(openssl rand -hex 12)"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          ADMIN_PASSWORD_HASH="$(cd server && python3 -c 'import sys; from app.common import hash_password; print(hash_password(sys.argv[1]))' "$ADMIN_PASSWORD")"
          (cd server && DATA_DIR=/tmp/webdata LLM_BACKEND=fake DEMO_CONTENT=on PAYMENTS_TEST_MODE=on REPLY_DEBOUNCE_MS=300 RL_REGISTER_PER_HOUR=1000 \
             ADMIN_PASSWORD_HASH="$ADMIN_PASSWORD_HASH" nohup python3 ../tools/web_dev.py 8010 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 30); do curl -fs localhost:8010/app/ >/dev/null && break; sleep 1; done
      - name: Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: iPhone-sized browser scenario
        run: node tools/web_e2e.js http://127.0.0.1:8010 web-screens
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: web-screens, path: web-screens, if-no-files-found: ignore }
      - if: failure()
        run: tail -n 60 /tmp/web.log || true
