name: Backend

on:
  push:
    paths: ["server/**", "deploy/**", "tools/mock_openrouter.py", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Unit/API tests (fake model)
        working-directory: server
        run: |
          pip install -q -r requirements-dev.txt
          pytest -q

  two-players:
    # Two simulated players and a third account through the real HTTP API; the AI is a local
    # stand-in for OpenRouter (streaming SSE, images), so no key is needed.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Start a mock OpenRouter and the API
        run: |
          pip install -q -r server/requirements.txt
          nohup python3 tools/mock_openrouter.py 9009 > /tmp/mock.log 2>&1 &
          mkdir -p /tmp/data
          (cd server && DATA_DIR=/tmp/data OPENROUTER_API_KEY=sk-or-mock OPENROUTER_BASE_URL=http://127.0.0.1:9009/api/v1 \
             nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &)
          for i in $(seq 1 30); do curl -fs localhost:8000/v1/health && break; sleep 1; done
      - name: Two-player end-to-end
        run: python3 server/tests/e2e_live.py http://127.0.0.1:8000 120
      - name: API log
        if: failure()
        run: |
          grep -v "GET /v1/rooms/.*/sync" /tmp/api.log | tail -n 40
          tail -n 20 /tmp/mock.log
